<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DuckDuckGo HTML'de ara</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="brand">
        <img class="brand-icon" src="assets/icons/icon48.png" alt="">
        <div>
          <p class="eyebrow">HIZLI ARAMA</p>
          <h1>DuckDuckGo <span>HTML</span></h1>
        </div>
      </header>

      <form class="search" action="https://html.duckduckgo.com/html/" method="get" target="_blank" rel="noopener">
        <label for="query">Ne aramak istiyorsun?</label>
        <div class="search-row">
          <input id="query" name="q" type="search" placeholder="Bir şeyler ara…" autocomplete="off" autofocus required>
          <button type="submit" aria-label="Ara">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.8"></circle>
              <path d="m16 16 5 5"></path>
            </svg>
          </button>
        </div>
      </form>

      <div class="hint">
        <span class="hint-dot" aria-hidden="true"></span>
        <p>Adres çubuğundaki aramalar da DuckDuckGo'ya yönlendirilir.</p>
      </div>

      <footer>
        <span>Hafif. Hızlı. HTML.</span>
        <a href="https://html.duckduckgo.com/html/" target="_blank" rel="noopener noreferrer">DuckDuckGo'yu aç <span aria-hidden="true">↗</span></a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
